name: Apply Phase 3B Corrections

on:
  push:
    branches:
      - fix/phase-3b-corrections
    paths:
      - .github/workflows/apply-phase3b-corrections.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase-3b-corrections

      - name: Apply focused corrections
        run: python scripts/apply_phase3b_corrections.py

      - name: Remove temporary patch machinery
        run: rm scripts/apply_phase3b_corrections.py .github/workflows/apply-phase3b-corrections.yml

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Rift breach evolutions and pause flow"
          git push origin HEAD:fix/phase-3b-corrections

      - name: Use Node 22.13
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rift Run tests
        run: node --test --test-concurrency=1 tests/rift-run.test.mjs

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
