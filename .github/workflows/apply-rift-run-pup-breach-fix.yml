name: Apply Rift Run Payload Breach Fix

on:
  push:
    branches:
      - fix/rift-run-pup-breach-victory
    paths:
      - .github/workflows/apply-rift-run-pup-breach-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rift-run-pup-breach-victory

      - name: Apply targeted fix
        run: python scripts/apply-rift-run-pup-breach-fix.py

      - name: Remove temporary patch files
        run: rm scripts/apply-rift-run-pup-breach-fix.py .github/workflows/apply-rift-run-pup-breach-fix.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Rift Run payload breach continuation"
          git push origin HEAD:fix/rift-run-pup-breach-victory
