name: Agent Bankshot Matrix

on:
  push:
    branches: [codex/bankshot-matrix]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply Bankshot patch
        run: python .github/agent-bankshot.py
      - name: Install dependencies
        run: npm ci
      - name: Focused regression
        run: node --test tests/ricochet.test.mjs
      - name: Full test gate
        run: npm test
      - name: Lint gate
        run: npm run lint
      - name: Commit verified pass
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Add Bankshot Matrix ricochet utility"
          git push origin HEAD:codex/bankshot-matrix
