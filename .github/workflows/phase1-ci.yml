name: Phase 1 CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply deterministic Phase 1 cleanup
        run: |
          node scripts/phase1-ui-cleanup.mjs
          node scripts/fix-phase1-stale-tests.mjs
      - name: Upload patched Phase 1 source
        uses: actions/upload-artifact@v4
        with:
          name: phase1-patched-source
          path: |
            app/game.tsx
            tests/pvp-server.test.mjs
            tests/pvp-socket.test.mjs
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
