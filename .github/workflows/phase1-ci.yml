name: Phase 1 Finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/commercial-ip-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply validated Phase 1 cleanup
        run: |
          node scripts/phase1-ui-cleanup.mjs
          node scripts/fix-phase1-stale-tests.mjs
          node scripts/fix-phase1-lint.mjs
      - name: Restore normal CI and remove migration scripts
        run: |
          cat > .github/workflows/phase1-ci.yml <<'WORKFLOW'
          name: PR CI

          on:
            pull_request:
              branches: [main]

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Use Node 22
                  uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                    cache: npm
                - name: Install dependencies
                  run: npm ci
                - name: Test
                  run: npm test
                - name: Lint
                  run: npm run lint
          WORKFLOW
          rm scripts/phase1-ui-cleanup.mjs scripts/fix-phase1-stale-tests.mjs scripts/fix-phase1-lint.mjs
          git diff --check
      - name: Commit finalized Phase 1 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Breach Runner Phase 1 cleanup"
          git push origin HEAD:${{ github.head_ref }}
