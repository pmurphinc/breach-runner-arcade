name: Phase 1 Cleanup

on:
  push:
    branches: [codex/commercial-ip-cleanup]

permissions:
  contents: write

jobs:
  apply-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: codex/commercial-ip-cleanup
      - name: Apply deterministic UI cleanup
        run: node scripts/phase1-ui-cleanup.mjs
      - name: Commit cleanup if needed
        run: |
          if git diff --quiet; then
            echo "No cleanup changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/game.tsx
          git commit -m "Finish Breach Runner player-facing identity cleanup"
          git push origin HEAD:codex/commercial-ip-cleanup
