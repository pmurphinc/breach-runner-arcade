name: Validate Production Domain Cutover

on:
  push:
    branches: [chore/breach-runner-production-domain]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/breach-runner-production-domain
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Record successful validation
        run: |
          mkdir -p .validation
          printf 'build_tests=passed\nlint=passed\n' > .validation/production-domain.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .validation/production-domain.txt
          git commit -m "Record production-domain validation"
          git push origin HEAD:chore/breach-runner-production-domain
