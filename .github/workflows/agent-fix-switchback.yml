name: Agent Switchback Visibility Fix

on:
  push:
    branches: [codex/fix-switchback-visibility]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply patch
        run: python .github/agent-fix-switchback.py
      - name: Install dependencies
        run: npm ci
      - name: Focused regression
        run: node --test tests/switchback-visibility.test.mjs
      - name: Full test gate
        run: npm test
      - name: Lint gate
        run: npm run lint
      - name: Commit verified fix
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Fix Switchback player visibility render state"
          git push origin HEAD:codex/fix-switchback-visibility
