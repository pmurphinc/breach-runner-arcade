name: Agent Switchback Visibility Fix

on:
  push:
    branches:
      - codex/fix-switchback-visibility

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused visibility fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          game_path = Path('app/game.tsx')
          source = game_path.read_text()
          old = '''      if (player.health > 0) {
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.rotate(player.angle * DEG);'''
          new = '''      if (player.health > 0) {
                ctx.save();
                // A player hull must never inherit destructive/transparent canvas
                // state from an earlier arena effect. Switchback can Form Shift
                // repeatedly during long runs, so make the player draw an explicit
                // render-state boundary instead of trusting whatever the previous
                // entity happened to leave behind.
                ctx.globalAlpha = 1;
                ctx.globalCompositeOperation = "source-over";
                ctx.shadowBlur = 0;
                ctx.setLineDash([]);
                ctx.lineDashOffset = 0;
                ctx.translate(player.x, player.y);
                ctx.rotate(player.angle * DEG);'''
          if old not in source:
              raise SystemExit('player draw anchor not found; refusing broad patch')
          source = source.replace(old, new, 1)
          game_path.write_text(source)

          test = r'''import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const source = readFileSync(new URL("../app/game.tsx", import.meta.url), "utf8");

          test("live player draw starts from an explicit visible canvas state", () => {
            const start = source.indexOf("if (player.health > 0)");
            assert.notEqual(start, -1);
            const draw = source.slice(start, start + 900);
            assert.match(draw, /ctx\.globalAlpha = 1/);
            assert.match(draw, /ctx\.globalCompositeOperation = "source-over"/);
            assert.match(draw, /ctx\.setLineDash\(\[\]\)/);
            assert.match(draw, /drawShipShape\(ctx, game\.ship\.id/);
          });

          test("Switchback Form Shift remains a handling-only state toggle", () => {
            const start = source.indexOf('ship === "flash"');
            assert.notEqual(start, -1);
            const branch = source.slice(start, start + 420);
            assert.match(branch, /player\.flashMode = player\.flashMode === "tank" \? "squid" : "tank"/);
            assert.doesNotMatch(branch, /globalAlpha|opacity|visible|health\s*=|ship\s*=/);
          });
          '''
          # Strip indentation introduced by the workflow heredoc while preserving code.
          lines = test.splitlines()
          cleaned = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines).lstrip() + '\n'
          Path('tests/switchback-visibility.test.mjs').write_text(cleaned)

          workflow = Path('.github/workflows/agent-fix-switchback.yml')
          workflow.unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Focused regression
        run: node --test tests/switchback-visibility.test.mjs

      - name: Full test gate
        run: npm test

      - name: Lint gate
        run: npm run lint

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Fix Switchback player visibility render state"
          git push origin HEAD:codex/fix-switchback-visibility
