name: Codex Harder Enrage Patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/harder-enrage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch, validate, and commit
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
              return text.replace(old, new, 1)

          def sub_once(text, pattern, replacement, label):
              text, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 regex match, found {n}")
              return text

          p = Path('app/difficulty.ts')
          d = p.read_text()
          d = once(d,
              '      wave: ReadonlyArray<{ enemy: EnrageEnemy; count: number }>;\n',
              '''      wave: ReadonlyArray<{ enemy: EnrageEnemy; count: number }>;
                healFraction: number;
                healDurationTicks: number;
                temporaryShieldFraction: number;
                temporaryShieldDurationTicks: number;
                minePulseIntervalTicks: number;
                minePulseCount: number;
          ''', 'enrage rule type')
          d = once(d,
              '      "The wormhole orbits with 200 integrity and you have to lead it. At 15% integrity it enrages, turns red, and repeatedly spits out mines, UFOs, and power-up-eating Scarabs. No collision shield — impacts hit hull under the normal rules.",\n',
              '      "The rift orbits with 200 integrity and you have to lead it. At 15% integrity it enrages, turns red, restores 10% of its maximum integrity over 10 seconds, and repeatedly spits out mines, UFOs, and power-up-eating Scarabs. No collision shield — impacts hit hull under the normal rules.",\n', 'difficult copy')
          d = once(d,
              '      thresholdFraction: 0.15,\n      waveIntervalTicks: ticksForSeconds(10),\n      wave: [\n',
              '      thresholdFraction: 0.15,\n      waveIntervalTicks: ticksForSeconds(10),\n      healFraction: 0.1,\n      healDurationTicks: ticksForSeconds(10),\n      temporaryShieldFraction: 0,\n      temporaryShieldDurationTicks: 0,\n      minePulseIntervalTicks: 0,\n      minePulseCount: 0,\n      wave: [\n', 'difficult values')
          d = once(d,
              '      "The wormhole has 350 integrity, orbits, and touching it burns hull in visible ticks. At 30% integrity it enrages, turns red, and repeatedly spits out mines, UFOs, and power-up-eating Scarabs.",\n',
              '      "The rift has 350 integrity, orbits, and touching it burns hull in visible ticks. At 30% integrity it enrages, turns red, restores 20% of its maximum integrity over 10 seconds, gains a 10%-integrity shield for 10 seconds, keeps its mixed hostile waves, and launches extra mines every 3 seconds.",\n', 'hard copy')
          d = once(d,
              '      thresholdFraction: 0.3,\n      waveIntervalTicks: ticksForSeconds(10),\n      wave: [\n',
              '      thresholdFraction: 0.3,\n      waveIntervalTicks: ticksForSeconds(10),\n      healFraction: 0.2,\n      healDurationTicks: ticksForSeconds(10),\n      temporaryShieldFraction: 0.1,\n      temporaryShieldDurationTicks: ticksForSeconds(10),\n      minePulseIntervalTicks: ticksForSeconds(3),\n      minePulseCount: 2,\n      wave: [\n', 'hard values')
          anchor = 'export const DIFFICULTY_ORDER: DifficultyId[] = ["practice", "easy", "difficult", "hard"];\n'
          helpers = '''export type EnrageRecoveryState = {
            healRemaining: number;
            healTicksLeft: number;
            shield: number;
            shieldTicksLeft: number;
          };

          export function createEnrageRecovery(): EnrageRecoveryState {
            return { healRemaining: 0, healTicksLeft: 0, shield: 0, shieldTicksLeft: 0 };
          }

          export function activateEnrageRecovery(state: EnrageRecoveryState, rules: DifficultyRules, maxIntegrity: number) {
            const enrage = rules.wormholeEnrage;
            if (!enrage.enabled) return;
            state.healRemaining = maxIntegrity * enrage.healFraction;
            state.healTicksLeft = enrage.healDurationTicks;
            state.shield = maxIntegrity * enrage.temporaryShieldFraction;
            state.shieldTicksLeft = enrage.temporaryShieldDurationTicks;
          }

          export function tickEnrageRecovery(state: EnrageRecoveryState, currentIntegrity: number, maxIntegrity: number) {
            let healed = 0;
            if (state.healTicksLeft > 0 && state.healRemaining > 0) {
              const scheduled = state.healRemaining / state.healTicksLeft;
              healed = Math.min(scheduled, Math.max(0, maxIntegrity - currentIntegrity));
              state.healRemaining = Math.max(0, state.healRemaining - scheduled);
              state.healTicksLeft -= 1;
            }
            if (state.shieldTicksLeft > 0) {
              state.shieldTicksLeft -= 1;
              if (state.shieldTicksLeft <= 0) state.shield = 0;
            }
            return healed;
          }

          export function absorbEnrageShield(state: EnrageRecoveryState, damage: number) {
            const incoming = Math.max(0, damage);
            const absorbed = Math.min(state.shield, incoming);
            state.shield -= absorbed;
            return { absorbed, toIntegrity: incoming - absorbed };
          }

          ''' + anchor
          d = once(d, anchor, helpers, 'recovery helpers')
          p.write_text(d)

          p = Path('app/game.tsx')
          g = p.read_text()
          g = once(g, '  absorbCollisionDamage,\n  advanceWormholeAngle,\n  createCollisionShield,\n', '  absorbCollisionDamage,\n  absorbEnrageShield,\n  activateEnrageRecovery,\n  advanceWormholeAngle,\n  createCollisionShield,\n  createEnrageRecovery,\n', 'imports 1')
          g = once(g, '  tickCollisionShield,\n  tickContactHazard,\n  wormholePosition,\n  type CollisionShieldState,\n', '  tickCollisionShield,\n  tickContactHazard,\n  tickEnrageRecovery,\n  wormholePosition,\n  type CollisionShieldState,\n  type EnrageRecoveryState,\n', 'imports 2')
          g = once(g, '  /** Ticks until the next automatic mixed enrage wave. */\n  enrageTimer: number;\n', '  /** Ticks until the next automatic mixed enrage wave. */\n  enrageTimer: number;\n  /** Heal-over-time and temporary shield state created by enrage. */\n  enrageRecovery: EnrageRecoveryState;\n  /** Ticks until Hard Mode\'s next dedicated mine pulse. */\n  enrageMineTimer: number;\n', 'state fields')
          g = once(g, '    enrageActive: false,\n    enrageTimer: 0,\n', '    enrageActive: false,\n    enrageTimer: 0,\n    enrageRecovery: createEnrageRecovery(),\n    enrageMineTimer: 0,\n', 'state init')

          loop_re = r'      if \(game\.enrageActive && game\.rules\.wormholeEnrage\.enabled\) \{.*?\n      \}\n\n      game\.shieldRipple'
          loop_new = '''      if (game.enrageActive && game.rules.wormholeEnrage.enabled) {
                const enrage = game.rules.wormholeEnrage;
                const authority = game.mode !== "coop" || netRef.current?.state.you?.id === netRef.current?.state.hostId;
                if (authority) {
                  const healed = tickEnrageRecovery(game.enrageRecovery, game.rivalHealth, game.rivalMaxHealth);
                  game.rivalHealth = Math.min(game.rivalMaxHealth, game.rivalHealth + healed);
                  game.enrageTimer -= 1;
                  if (game.enrageTimer <= 0) {
                    game.enrageTimer = enrage.waveIntervalTicks;
                    spawnEnrageWave(game);
                  }
                  if (enrage.minePulseIntervalTicks > 0) {
                    game.enrageMineTimer -= 1;
                    if (game.enrageMineTimer <= 0) {
                      game.enrageMineTimer = enrage.minePulseIntervalTicks;
                      const count = enrage.minePulseCount * (game.mode === "coop" ? 2 : 1);
                      for (let i = 0; i < count; i += 1) game.enemies.push(makeEnemy("mines", game.portalX, game.portalY, i, count));
                      pushSpawn(game, "hostile", "mines", game.portalX, game.portalY, count);
                      playCue("spawn:mines", 0.14);
                    }
                  }
                }
              }

              game.shieldRipple'''
          g = sub_once(g, loop_re, loop_new, 'enrage loop')

          damage_re = r'            const damage = rivalDamageFor\(power\.type\);.*?            game\.noticeLife = 115;\n\n            const enrage = game\.rules\.wormholeEnrage;'
          damage_new = '''            const damage = rivalDamageFor(power.type);
                        const enrageHit = absorbEnrageShield(game.enrageRecovery, damage);
                        const integrityDamage = enrageHit.toIntegrity;
                        game.lastRivalCause = power.type;
                        game.lastRivalDamage = Math.min(game.rivalHealth, integrityDamage);
                        game.rivalHealth -= integrityDamage;
                        game.score += 750 + damage * 10;
                        game.notice = enrageHit.absorbed > 0
                          ? `${WEAPONS[power.type].short} SENT // RIFT SHIELD −${Math.round(enrageHit.absorbed)}${integrityDamage > 0 ? ` // RIVAL −${Math.round(integrityDamage)}` : ""}`
                          : `${WEAPONS[power.type].short} SENT // RIVAL −${damage}`;
                        game.noticeLife = 115;

                        const enrage = game.rules.wormholeEnrage;'''
          g = sub_once(g, damage_re, damage_new, 'rival damage')
          g = once(g, '              game.enrageActive = true;\n              game.enrageTimer = enrage.waveIntervalTicks;\n              spawnEnrageWave(game);\n', '              game.enrageActive = true;\n              game.enrageTimer = enrage.waveIntervalTicks;\n              game.enrageMineTimer = enrage.minePulseIntervalTicks;\n              activateEnrageRecovery(game.enrageRecovery, game.rules, game.rivalMaxHealth);\n              spawnEnrageWave(game);\n', 'activation')
          g = once(g, '              game.victoryExplosionFired = false;\n              game.enrageActive = false;\n              game.incoming = null;\n', '              game.victoryExplosionFired = false;\n              game.enrageActive = false;\n              game.enrageTimer = 0;\n              game.enrageMineTimer = 0;\n              game.enrageRecovery = createEnrageRecovery();\n              game.incoming = null;\n', 'cleanup')
          p.write_text(g)

          p = Path('tests/difficulty.test.mjs')
          t = p.read_text()
          t = once(t, '  absorbCollisionDamage,\n', '  absorbCollisionDamage,\n  absorbEnrageShield,\n  activateEnrageRecovery,\n', 'test imports 1')
          t = once(t, '  createContactHazard,\n', '  createContactHazard,\n  createEnrageRecovery,\n', 'test imports 2')
          t = once(t, '  tickContactHazard,\n', '  tickContactHazard,\n  tickEnrageRecovery,\n', 'test imports 3')
          t += r'''

          test("difficult enrage heals 10% over 10 seconds", () => {
            const state = createEnrageRecovery();
            activateEnrageRecovery(state, DIFFICULT, 200);
            let hp = 30, healed = 0;
            for (let i = 0; i < DIFFICULT.wormholeEnrage.healDurationTicks; i += 1) {
              const amount = tickEnrageRecovery(state, hp, 200); hp += amount; healed += amount;
            }
            assert.ok(Math.abs(healed - 20) < 1e-8);
            assert.equal(state.shield, 0);
          });

          test("hard enrage heals 20%, shields 10% for 10 seconds, and pulses mines every 3 seconds", () => {
            const state = createEnrageRecovery();
            activateEnrageRecovery(state, HARD, 350);
            assert.equal(state.shield, 35);
            assert.equal(state.shieldTicksLeft, ticksForSeconds(10));
            assert.equal(HARD.wormholeEnrage.minePulseIntervalTicks, ticksForSeconds(3));
            const hit = absorbEnrageShield(state, 20);
            assert.equal(hit.absorbed, 20);
            assert.equal(hit.toIntegrity, 0);
            let hp = 105, healed = 0;
            for (let i = 0; i < HARD.wormholeEnrage.healDurationTicks; i += 1) {
              const amount = tickEnrageRecovery(state, hp, 350); hp += amount; healed += amount;
            }
            assert.ok(Math.abs(healed - 70) < 1e-8);
            assert.equal(state.shield, 0);
          });
          '''
          p.write_text(t)
          PY

          rm -f .github/workflows/codex-harder-enrage.yml .codex-enrage-trigger .codex-enrage-trigger-2
          npm ci
          npm test
          npm run lint
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make PvE enrage more punishing"
          git push origin HEAD:codex/harder-enrage
