name: Codex Harder Enrage Patch

on:
  push:
    branches:
      - codex/harder-enrage
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/harder-enrage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch enrage rules and gameplay
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          difficulty_path = Path('app/difficulty.ts')
          d = difficulty_path.read_text()

          d = replace_once(d,
          '''      /** Mixed hostile wave emitted by the enraged wormhole. */
                wave: ReadonlyArray<{ enemy: EnrageEnemy; count: number }>;
          ''',
          '''      /** Mixed hostile wave emitted by the enraged wormhole. */
                wave: ReadonlyArray<{ enemy: EnrageEnemy; count: number }>;
                /** Total integrity restored after enrage, as a fraction of max integrity. */
                healFraction: number;
                /** Number of ticks across which the enrage heal is delivered. */
                healDurationTicks: number;
                /** Temporary rift shield granted at enrage, as a fraction of max integrity. */
                temporaryShieldFraction: number;
                /** Lifetime of the temporary rift shield. Zero disables it. */
                temporaryShieldDurationTicks: number;
                /** Hard-mode mine pulse interval. Zero disables dedicated mine pulses. */
                minePulseIntervalTicks: number;
                /** Mines spawned per dedicated pulse before co-op scaling. */
                minePulseCount: number;
          ''', 'enrage rule fields')

          d = replace_once(d,
          '''      "The wormhole orbits with 200 integrity and you have to lead it. At 15% integrity it enrages, turns red, and repeatedly spits out mines, UFOs, and power-up-eating Scarabs. No collision shield — impacts hit hull under the normal rules.",
          ''',
          '''      "The rift orbits with 200 integrity and you have to lead it. At 15% integrity it enrages, turns red, restores 10% of its maximum integrity over 10 seconds, and repeatedly spits out mines, UFOs, and power-up-eating Scarabs. No collision shield — impacts hit hull under the normal rules.",
          ''', 'difficult blurb')

          d = replace_once(d,
          '''      wave: [
                { enemy: "mines", count: 6 },
                { enemy: "ufo", count: 1 },
                { enemy: "scarab", count: 2 },
              ],
            },
          },
          hard: {
          ''',
          '''      wave: [
                { enemy: "mines", count: 6 },
                { enemy: "ufo", count: 1 },
                { enemy: "scarab", count: 2 },
              ],
              healFraction: 0.1,
              healDurationTicks: ticksForSeconds(10),
              temporaryShieldFraction: 0,
              temporaryShieldDurationTicks: 0,
              minePulseIntervalTicks: 0,
              minePulseCount: 0,
            },
          },
          hard: {
          ''', 'difficult enrage values')

          d = replace_once(d,
          '''      "The wormhole has 350 integrity, orbits, and touching it burns hull in visible ticks. At 30% integrity it enrages, turns red, and repeatedly spits out mines, UFOs, and power-up-eating Scarabs.",
          ''',
          '''      "The rift has 350 integrity, orbits, and touching it burns hull in visible ticks. At 30% integrity it enrages, turns red, restores 20% of its maximum integrity over 10 seconds, gains a 10%-integrity shield for 10 seconds, keeps its mixed hostile waves, and launches extra mines every 3 seconds.",
          ''', 'hard blurb')

          old_hard = '''      wave: [
                { enemy: "mines", count: 6 },
                { enemy: "ufo", count: 1 },
                { enemy: "scarab", count: 2 },
              ],
            },
          },
          };
          '''
          new_hard = '''      wave: [
                { enemy: "mines", count: 6 },
                { enemy: "ufo", count: 1 },
                { enemy: "scarab", count: 2 },
              ],
              healFraction: 0.2,
              healDurationTicks: ticksForSeconds(10),
              temporaryShieldFraction: 0.1,
              temporaryShieldDurationTicks: ticksForSeconds(10),
              minePulseIntervalTicks: ticksForSeconds(3),
              minePulseCount: 2,
            },
          },
          };
          '''
          d = replace_once(d, old_hard, new_hard, 'hard enrage values')

          insert_anchor = '''export const DIFFICULTY_ORDER: DifficultyId[] = ["practice", "easy", "difficult", "hard"];
          '''
          recovery_helpers = '''export type EnrageRecoveryState = {
            healRemaining: number;
            healTicksLeft: number;
            shield: number;
            shieldTicksLeft: number;
          };

          export function createEnrageRecovery(): EnrageRecoveryState {
            return { healRemaining: 0, healTicksLeft: 0, shield: 0, shieldTicksLeft: 0 };
          }

          export function activateEnrageRecovery(
            state: EnrageRecoveryState,
            rules: DifficultyRules,
            maxIntegrity: number
          ) {
            const enrage = rules.wormholeEnrage;
            if (!enrage.enabled) {
              state.healRemaining = 0;
              state.healTicksLeft = 0;
              state.shield = 0;
              state.shieldTicksLeft = 0;
              return;
            }
            state.healRemaining = maxIntegrity * enrage.healFraction;
            state.healTicksLeft = enrage.healDurationTicks;
            state.shield = maxIntegrity * enrage.temporaryShieldFraction;
            state.shieldTicksLeft = enrage.temporaryShieldDurationTicks;
          }

          export function tickEnrageRecovery(
            state: EnrageRecoveryState,
            currentIntegrity: number,
            maxIntegrity: number
          ) {
            let healed = 0;
            if (state.healTicksLeft > 0 && state.healRemaining > 0) {
              const scheduled = state.healRemaining / state.healTicksLeft;
              healed = Math.min(scheduled, Math.max(0, maxIntegrity - currentIntegrity));
              state.healRemaining = Math.max(0, state.healRemaining - scheduled);
              state.healTicksLeft -= 1;
            }

            let shieldExpired = false;
            if (state.shieldTicksLeft > 0) {
              state.shieldTicksLeft -= 1;
              if (state.shieldTicksLeft <= 0 && state.shield > 0) {
                state.shield = 0;
                shieldExpired = true;
              }
            }
            return { healed, shieldExpired };
          }

          export function absorbEnrageShield(state: EnrageRecoveryState, damage: number) {
            const incoming = Math.max(0, damage);
            const absorbed = Math.min(state.shield, incoming);
            state.shield -= absorbed;
            return {
              absorbed,
              toIntegrity: incoming - absorbed,
              broke: absorbed > 0 && state.shield <= 0,
            };
          }

          ''' + insert_anchor
          d = replace_once(d, insert_anchor, recovery_helpers, 'enrage recovery helpers')
          difficulty_path.write_text(d)

          game_path = Path('app/game.tsx')
          g = game_path.read_text()

          g = replace_once(g,
          '''  absorbCollisionDamage,
            advanceWormholeAngle,
            createCollisionShield,
          ''',
          '''  absorbCollisionDamage,
            absorbEnrageShield,
            activateEnrageRecovery,
            advanceWormholeAngle,
            createCollisionShield,
            createEnrageRecovery,
          ''', 'game imports part 1')
          g = replace_once(g,
          '''  tickCollisionShield,
            tickContactHazard,
            wormholePosition,
            type CollisionShieldState,
          ''',
          '''  tickCollisionShield,
            tickContactHazard,
            tickEnrageRecovery,
            wormholePosition,
            type CollisionShieldState,
            type EnrageRecoveryState,
          ''', 'game imports part 2')

          g = replace_once(g,
          '''  /** Ticks until the next automatic mixed enrage wave. */
            enrageTimer: number;
            bullets: Bullet[];
          ''',
          '''  /** Ticks until the next automatic mixed enrage wave. */
            enrageTimer: number;
            /** Heal-over-time and temporary shield state created by enrage. */
            enrageRecovery: EnrageRecoveryState;
            /** Ticks until Hard Mode's next dedicated mine pulse. */
            enrageMineTimer: number;
            bullets: Bullet[];
          ''', 'game enrage state fields')

          g = replace_once(g,
          '''    enrageActive: false,
              enrageTimer: 0,
              bullets: [],
          ''',
          '''    enrageActive: false,
              enrageTimer: 0,
              enrageRecovery: createEnrageRecovery(),
              enrageMineTimer: 0,
              bullets: [],
          ''', 'game enrage init')

          old_tick = '''      if (game.enrageActive && game.rules.wormholeEnrage.enabled) {
                game.enrageTimer -= 1;
                if (game.enrageTimer <= 0) {
                  game.enrageTimer = game.rules.wormholeEnrage.waveIntervalTicks;
                  spawnEnrageWave(game);
                }
              }
          '''
          new_tick = '''      if (game.enrageActive && game.rules.wormholeEnrage.enabled) {
                const enrage = game.rules.wormholeEnrage;
                const enrageAuthority = game.mode !== "coop" || netRef.current?.state.you?.id === netRef.current?.state.hostId;

                if (enrageAuthority) {
                  const recovery = tickEnrageRecovery(game.enrageRecovery, game.rivalHealth, game.rivalMaxHealth);
                  game.rivalHealth = Math.min(game.rivalMaxHealth, game.rivalHealth + recovery.healed);

                  game.enrageTimer -= 1;
                  if (game.enrageTimer <= 0) {
                    game.enrageTimer = enrage.waveIntervalTicks;
                    spawnEnrageWave(game);
                  }

                  if (enrage.minePulseIntervalTicks > 0) {
                    game.enrageMineTimer -= 1;
                    if (game.enrageMineTimer <= 0) {
                      game.enrageMineTimer = enrage.minePulseIntervalTicks;
                      const count = enrage.minePulseCount * (game.mode === "coop" ? 2 : 1);
                      for (let i = 0; i < count; i += 1) {
                        game.enemies.push(makeEnemy("mines", game.portalX, game.portalY, i, count));
                      }
                      pushSpawn(game, "hostile", "mines", game.portalX, game.portalY, count);
                      playCue("spawn:mines", 0.14);
                    }
                  }
                }
              }
          '''
          g = replace_once(g, old_tick, new_tick, 'enrage tick loop')

          old_damage = '''            const damage = rivalDamageFor(power.type);
                        game.lastRivalCause = power.type;
                        game.lastRivalDamage = Math.min(game.rivalHealth, damage);
                        game.rivalHealth -= damage;
                        game.score += 750 + damage * 10;
                        game.notice = `${WEAPONS[power.type].short} SENT // RIVAL −${damage}`;
                        game.noticeLife = 115;
          '''
          new_damage = '''            const damage = rivalDamageFor(power.type);
                        const enrageHit = absorbEnrageShield(game.enrageRecovery, damage);
                        const integrityDamage = enrageHit.toIntegrity;
                        game.lastRivalCause = power.type;
                        game.lastRivalDamage = Math.min(game.rivalHealth, integrityDamage);
                        game.rivalHealth -= integrityDamage;
                        game.score += 750 + damage * 10;
                        game.notice = enrageHit.absorbed > 0
                          ? `${WEAPONS[power.type].short} SENT // RIFT SHIELD −${Math.round(enrageHit.absorbed)}${integrityDamage > 0 ? ` // RIVAL −${Math.round(integrityDamage)}` : ""}`
                          : `${WEAPONS[power.type].short} SENT // RIVAL −${damage}`;
                        game.noticeLife = 115;
          '''
          g = replace_once(g, old_damage, new_damage, 'rival damage shield')

          old_activate = '''              game.enrageActive = true;
                            game.enrageTimer = enrage.waveIntervalTicks;
                            spawnEnrageWave(game);
          '''
          new_activate = '''              game.enrageActive = true;
                            game.enrageTimer = enrage.waveIntervalTicks;
                            game.enrageMineTimer = enrage.minePulseIntervalTicks;
                            activateEnrageRecovery(game.enrageRecovery, game.rules, game.rivalMaxHealth);
                            spawnEnrageWave(game);
          '''
          g = replace_once(g, old_activate, new_activate, 'enrage activation')

          old_victory = '''              game.victoryExplosionFired = false;
                            game.enrageActive = false;
                            game.incoming = null;
          '''
          new_victory = '''              game.victoryExplosionFired = false;
                            game.enrageActive = false;
                            game.enrageTimer = 0;
                            game.enrageMineTimer = 0;
                            game.enrageRecovery = createEnrageRecovery();
                            game.incoming = null;
          '''
          g = replace_once(g, old_victory, new_victory, 'enrage victory cleanup')

          old_guest = '''        game.portalAngle = world.portalAngle;
                    game.enrageActive = world.enrageActive;
                    game.enemies = world.enemies.map((enemy) => ({ ...enemy })) as unknown as Enemy[];
          '''
          new_guest = '''        game.portalAngle = world.portalAngle;
                    if (!game.enrageActive && world.enrageActive) {
                      activateEnrageRecovery(game.enrageRecovery, game.rules, game.rivalMaxHealth);
                      game.enrageMineTimer = game.rules.wormholeEnrage.enabled ? game.rules.wormholeEnrage.minePulseIntervalTicks : 0;
                    }
                    game.enrageActive = world.enrageActive;
                    game.enemies = world.enemies.map((enemy) => ({ ...enemy })) as unknown as Enemy[];
          '''
          g = replace_once(g, old_guest, new_guest, 'coop guest enrage state')

          game_path.write_text(g)

          test_path = Path('tests/difficulty.test.mjs')
          t = test_path.read_text()
          t = replace_once(t,
          '''  DIFFICULTIES,
            PVP_RULES,
            absorbCollisionDamage,
          ''',
          '''  DIFFICULTIES,
            PVP_RULES,
            absorbCollisionDamage,
            absorbEnrageShield,
            activateEnrageRecovery,
          ''', 'test imports part 1')
          t = replace_once(t,
          '''  createCollisionShield,
            createContactHazard,
            pilotSpawn,
          ''',
          '''  createCollisionShield,
            createContactHazard,
            createEnrageRecovery,
            pilotSpawn,
          ''', 'test imports part 2')
          t = replace_once(t,
          '''  tickCollisionShield,
            tickContactHazard,
            ticksForSeconds,
          ''',
          '''  tickCollisionShield,
            tickContactHazard,
            tickEnrageRecovery,
            ticksForSeconds,
          ''', 'test imports part 3')

          t += r'''

          // ------------------------------------------------------- ENRAGE recovery

          test("difficult enrage restores 10% of maximum integrity over 10 seconds", () => {
            const state = createEnrageRecovery();
            const maxIntegrity = DIFFICULT.rivalIntegrity;
            activateEnrageRecovery(state, DIFFICULT, maxIntegrity);
            let integrity = maxIntegrity * DIFFICULT.wormholeEnrage.thresholdFraction;
            let healed = 0;
            for (let i = 0; i < DIFFICULT.wormholeEnrage.healDurationTicks; i += 1) {
              const tick = tickEnrageRecovery(state, integrity, maxIntegrity);
              integrity += tick.healed;
              healed += tick.healed;
            }
            assert.ok(Math.abs(healed - maxIntegrity * 0.1) < 1e-8);
            assert.equal(state.shield, 0);
            assert.equal(DIFFICULT.wormholeEnrage.minePulseIntervalTicks, 0);
          });

          test("hard enrage restores 20%, grants a 10% shield for 10 seconds, and pulses mines every 3 seconds", () => {
            const state = createEnrageRecovery();
            const maxIntegrity = HARD.rivalIntegrity;
            activateEnrageRecovery(state, HARD, maxIntegrity);
            assert.equal(state.shield, maxIntegrity * 0.1);
            assert.equal(state.shieldTicksLeft, ticksForSeconds(10));
            assert.equal(HARD.wormholeEnrage.minePulseIntervalTicks, ticksForSeconds(3));
            assert.equal(HARD.wormholeEnrage.minePulseCount, 2);

            const hit = absorbEnrageShield(state, maxIntegrity * 0.06);
            assert.equal(hit.toIntegrity, 0);
            assert.equal(hit.absorbed, maxIntegrity * 0.06);
            assert.ok(Math.abs(state.shield - maxIntegrity * 0.04) < 1e-8);

            let integrity = maxIntegrity * HARD.wormholeEnrage.thresholdFraction;
            let healed = 0;
            for (let i = 0; i < HARD.wormholeEnrage.healDurationTicks; i += 1) {
              const tick = tickEnrageRecovery(state, integrity, maxIntegrity);
              integrity += tick.healed;
              healed += tick.healed;
            }
            assert.ok(Math.abs(healed - maxIntegrity * 0.2) < 1e-8);
            assert.equal(state.shield, 0, "temporary shield expires after the same 10-second window");
          });
          '''
          test_path.write_text(t)
          PY

          rm .github/workflows/codex-harder-enrage.yml
          npm ci
          npm test
          npm run lint
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/difficulty.ts app/game.tsx tests/difficulty.test.mjs .github/workflows/codex-harder-enrage.yml
          git commit -m "Make PvE enrage more punishing"
          git push origin HEAD:codex/harder-enrage
